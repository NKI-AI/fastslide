[build-system]
# meson-python >= 0.17 for robust limited-API (abi3) wheel handling (it refuses
# limited-API + free-threaded builds rather than emitting a broken wheel).
requires = ["meson-python>=0.17.0", "ninja", "nanobind>=2.0.0"]
build-backend = "mesonpy"

[project]
name = "fastslide"
version = "0.8.1"
description = "High-performance whole slide image reader for digital pathology"
readme = "README.md"
authors = [
    {name = "Jonas Teuwen", email = "j.teuwen@nki.nl"}
]
license = {text = "Apache-2.0"}
# From 3.12 the extension is built against CPython's stable ABI (abi3), so a
# single cp312-abi3 wheel serves every CPython >= 3.12. 3.11 predates that floor
# and is served by a separate version-specific cp311 wheel.
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/NKI-AI/fastslide"
Documentation = "https://docs.aifo.dev/fastslide/"
Repository = "https://github.com/NKI-AI/fastslide"
Issues = "https://github.com/NKI-AI/fastslide/issues"

[tool.meson-python]
# Master switch for stable-ABI (abi3) wheel tagging. Building the extension
# against the limited API is not enough on its own: meson-python reads the wheel
# ABI tag from THIS key, so without it a limited-API build still ships as
# `cp3XX-cp3XX` and pip refuses to install it on any later Python.
#
# It is deliberately paired with `python.allow_limited_api=false` in
# meson.build's default_options, which is the only per-build override
# meson-python honours (it can disable, never enable). Defaulting to disabled
# means an unflagged source build is version-specific and always succeeds --
# including on 3.11, which nanobind cannot build against the limited API at all.
# Only the release job's 3.12 leg opts back in with
# `-Dpython.allow_limited_api=true`, which is what produces the cp312-abi3 wheel.
limited-api = true

[tool.meson-python.args]
setup = [
    "--wrap-mode=forcefallback",
    # NOTE: do not add --prefer-static. It makes Meson hunt for a static
    # libpython (libpythonXY.a), which CPython does not ship, breaking the
    # nanobind Python dependency. Codecs are already static via the
    # default_library=static wraps below; the extension links libpython's
    # import library (shared), as required.
    "-Ddefault_library=static",
    "-Dbuild_python=true",
    "-Dbuild_tests=false",
    "-Dbuild_tool=false",
    "-Dbuild_c_api=false",
    # simpletiff defaults to building its gtest suite (no gtest wrap here) and to
    # default_library=shared; force both off so it links statically into the
    # self-contained _fastslide extension with no extra DLL.
    "-Dsimpletiff:build_tests=false",
    "-Dsimpletiff:default_library=static",
    # Don't build dependency test suites for the wheel -- pure wasted compile
    # time (they are never installed thanks to --skip-subprojects below).
    # libdicom's tests drag in the `check` subproject; pugixml builds its check.
    "-Dpugixml:tests=false",
    "-Dlibdicom:tests=false",
    # highway resolves `dependency('gtest')` unconditionally (gated only by
    # test_standalone, NOT by `tests`), so it would configure + build the whole
    # googletest/gmock subproject even with tests disabled. test_standalone=true
    # makes highway use its built-in test harness and never touch gtest.
    "-Dhighway:test_standalone=true",
]
# Only install the top-level fastslide targets (the _fastslide extension + the
# Python package). Subproject wraps (fmt, gtest, libdicom, codecs, ...) declare
# `install: true` for their static libs/headers, which land in {libdir_static}/
# {includedir} -- locations with no wheel equivalent, so meson-python aborts with
# "Could not map installation path ... libfmt.a". Everything is statically linked
# into _fastslide at build time, so skipping subproject installs is exactly right.
install = [
    "--skip-subprojects",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

