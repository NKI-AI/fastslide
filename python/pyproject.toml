[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "czi-reader"
version = "0.5.2"
description = "Pure-Python reader for Zeiss CZI: parse header, index tiles by pyramid level, and decode tiles."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "LGPL-3.0-or-later"}
authors = [{name = "libczi contributors"}]
dependencies = [
  "numpy>=1.26",
  "zstandard>=0.22",
]

[project.optional-dependencies]
jxr = ["imagecodecs>=2024.12.30"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]


