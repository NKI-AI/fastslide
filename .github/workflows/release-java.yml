# Build and publish the FastSlide Java artifacts (wrapper JAR + per-platform
# native classifier JARs) as a GitHub Release.
#
# Design (see docs/source/guides/java_packages.rst):
#   - `build`: produce each platform's classifier JAR where it CAN be built.
#       * linux/darwin: built natively on a matching runner.
#       * windows: CROSS-compiled on Linux via the hermetic Zig toolchain.
#         Windows cannot be a Bazel *host* here because aspect_rules_py /
#         rules_uv have no Windows host support ("Unsupported platform
#         windows"), which breaks analysis of even pure Java targets. Building
#         on a Linux host (target=windows) avoids that.
#   - `smoke`: run the shipped JARs through fastslidetool on the REAL target
#       runner (incl. native Windows), needing only a JDK -- no Bazel. This is
#       what validates the artifact on-target.
#   - `release`: needs every smoke job, so a release is only cut when all
#       selected platforms built and smoke-tested successfully.
#
# Trigger: manual only (`workflow_dispatch`). It does NOT run on a version bump.
name: Release Java artifacts

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a full release (false = prerelease/snapshot)"
        type: boolean
        default: false
      platforms:
        description: "Comma-separated platform keys to build"
        type: string
        default: "linux_x86_64,linux_arm64,darwin_x86_64,darwin_aarch64,windows_x86_64,windows_arm64"

permissions:
  contents: read

concurrency:
  group: release-java-${{ github.ref }}
  cancel-in-progress: true

# Force UTF-8 for Python stdio so the build scripts' status glyphs do not crash
# on Windows runners (default code page is cp1252).
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # Run all JavaScript actions on Node.js 24; Node.js 20 is deprecated on the
  # runners (removed 2026-09-16). Covers the third-party actions too, not just
  # the actions/* ones.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.builder }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            builder: ubuntu-24.04
          - platform: linux_arm64
            builder: ubuntu-24.04-arm
          # Cross-compiled on the arm64 Mac (Apple toolchain targets x86_64):
          # the Intel runner is far slower, and the artifact is still validated
          # on a real Intel host in the smoke phase below.
          - platform: darwin_x86_64
            builder: macos-14
          - platform: darwin_aarch64
            builder: macos-14
          # Windows is cross-compiled on Linux (see header note).
          - platform: windows_x86_64
            builder: ubuntu-24.04
          - platform: windows_arm64
            builder: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Decide whether to build this platform
        id: gate
        shell: bash
        run: |
          selected=",${{ inputs.platforms }},"
          selected="${selected// /}"
          if [[ "${selected}" == *",${{ matrix.platform }},"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false (not in inputs.platforms)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # ubuntu images ship large SDKs; the C++ build + hermetic Zig toolchain
      # need room. Mirrors format_check.yml.
      - name: Free disk space (Linux)
        if: steps.gate.outputs.run == 'true' && runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      # bazelisk honors USE_BAZEL_VERSION above all else; pin the repo's exact
      # version (.bazelversion) instead of letting it resolve to "latest".
      - name: Pin Bazel version
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: echo "USE_BAZEL_VERSION=$(tr -d '[:space:]' < .bazelversion)" >> "$GITHUB_ENV"

      # Installs a real cross-OS `bazel` launcher and manages Bazel caches in
      # default locations OUTSIDE the workspace (Bazel 9 requires this for the
      # repo-contents cache).
      - name: Set up Bazel
        if: steps.gate.outputs.run == 'true'
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ matrix.platform }}

      - name: Build native + JARs (${{ matrix.platform }})
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: python3 tools/build_java_artifacts.py --platform ${{ matrix.platform }} --bazel bazel

      - name: Upload native classifier JAR
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}
          path: artifacts/jars/fastslide-native-*-*.jar
          if-no-files-found: error
          retention-days: 7

      # The platform-independent wrapper JAR is identical from every build;
      # upload it under a per-platform name so any single-platform run is
      # self-sufficient (downloads dedupe by filename).
      - name: Upload wrapper JAR
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: wrapper-${{ matrix.platform }}
          path: artifacts/jars/fastslide-java-*.jar
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            runner: ubuntu-24.04
            java_arch: x64
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
            java_arch: aarch64
          # No bootable Intel macOS runner; validate the x86_64 dylib under
          # Rosetta on the arm64 runner with an x86_64 JDK.
          - platform: darwin_x86_64
            runner: macos-14
            java_arch: x64
            rosetta: true
          - platform: darwin_aarch64
            runner: macos-14
            java_arch: aarch64
          - platform: windows_x86_64
            runner: windows-2022
            java_arch: x64
          - platform: windows_arm64
            runner: windows-11-arm
            java_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Decide whether to smoke this platform
        id: gate
        shell: bash
        run: |
          selected=",${{ inputs.platforms }},"
          selected="${selected// /}"
          if [[ "${selected}" == *",${{ matrix.platform }},"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Run the x86_64 JVM + dylib under emulation on the arm64 runner.
      - name: Install Rosetta
        if: steps.gate.outputs.run == 'true' && matrix.rosetta
        run: softwareupdate --install-rosetta --agree-to-license

      # JDK to RUN the smoke test. FastSlide's FFM code needs a JDK >= 22
      # (stable java.lang.foreign); 23 is the highest Temurin ships across
      # every runner arch here, including windows-11-arm. The architecture is
      # pinned per platform so the JVM (and thus the dylib/dll it loads) matches
      # the artifact under test -- x64 here runs via Rosetta on the arm runner.
      - name: Set up JDK
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "23"
          architecture: ${{ matrix.java_arch }}

      - name: Download built JARs
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@v6
        with:
          path: artifacts/jars
          merge-multiple: true

      - name: On-target smoke test (${{ matrix.platform }})
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: python3 tools/smoke_test_java.py --platform ${{ matrix.platform }}

  release:
    name: Publish GitHub Release
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
      id-token: write # SLSA provenance signing
      attestations: write # record the attestation
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all built JARs
        uses: actions/download-artifact@v6
        with:
          path: artifacts/jars
          merge-multiple: true

      - name: List collected artifacts
        shell: bash
        run: ls -l artifacts/jars

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: artifacts/jars/*.jar

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          channel="--snapshot"
          require=""
          if [[ "${{ inputs.release }}" == "true" ]]; then
            channel="--release"
            require="--require-all"
          fi
          python3 tools/publish_java_artifacts.py --dest github ${channel} ${require}
