# Build, test, and publish a full FastSlide release: the Java artifacts (wrapper
# JAR + per-platform native classifier JARs) and the Python wheels, tied
# together by one GitHub Release. Wheels are also published to PyPI.
#
# Design (see docs/source/guides/packages_and_releases.rst):
#   - build-java / build-wheels: produce each platform's artifacts where they
#     CAN be built:
#       * linux/darwin: built on a matching runner (darwin_x86_64 is cross-built
#         on the arm64 Mac via the Apple toolchain).
#       * windows_x86_64 / windows_arm64 (JAVA): built NATIVELY on a matching
#         Windows runner (windows-2022 / windows-11-arm) with MSVC via Meson
#         (build-java job, method: meson). Meson compiles the C API as a
#         self-contained shared DLL (deps static via subprojects/*.wrap, static
#         CRT); only the native classifier JAR is produced this way -- the
#         platform-independent wrapper/tool JARs come from the dedicated,
#         always-run build-java-wrapper job (Bazel on Linux).
#         Windows cannot be a Bazel *host* here because aspect_rules_py /
#         rules_uv have no Windows host support ("Unsupported platform windows").
#       * windows_x86_64 / windows_arm64 (WHEELS): built NATIVELY on a matching
#         Windows runner (windows-2022 / windows-11-arm) with MSVC via Meson +
#         nanobind + cibuildwheel (build-wheels job, method: meson). All deps are
#         compiled from source through subprojects/*.wrap and linked statically,
#         sidestepping the missing Windows Bazel rules.
#   - build-deb / smoke-deb: build the Linux-only Debian packages (runtime .so +
#     CLI, and a -dev headers package) with the NATIVE host toolchain, then
#     install them in a clean ubuntu:24.04 container and compile+run a standalone
#     C++ smoke against the installed SDK (plus the shipped fastslidetool CLI).
#   - smoke-java: run the shipped JARs through fastslidetool on the REAL target
#     runner (incl. native Windows), needing only a JDK -- no Bazel.
#   - publish-pypi: upload wheels + to PyPI via Trusted Publishing (full release
#     only). Requires a PyPI trusted publisher configured for this repo, this
#     workflow file (release.yml), and the `pypi` environment.
#   - github-release: needs every build/smoke job, so a release is only cut when
#     all selected platforms succeed. Attaches every artifact + provenance.
#
# Trigger: manual only (`workflow_dispatch`). It does NOT run on a version bump.
name: Release FastSlide
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a full release (false = prerelease/snapshot, no PyPI)"
        type: boolean
        default: false
      platforms:
        description: "Comma-separated platform keys to build"
        type: string
        default: "linux_x86_64,linux_arm64,darwin_x86_64,darwin_aarch64,windows_x86_64,windows_arm64"
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
# Force UTF-8 for Python stdio so the build scripts' status glyphs do not crash
# on Windows runners (default code page is cp1252). Run all JavaScript actions
# on Node.js 24 (Node.js 20 is deprecated on the runners).
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  build-java:
    name: Build Java ${{ matrix.platform }}
    runs-on: ${{ matrix.builder }}
    strategy:
      fail-fast: false
      matrix:
        # method=bazel: linux/macOS native libs. method=meson: Windows native
        # libs built on a real Windows host with MSVC via Meson (Bazel has no
        # Windows host support, and Zig cross emits a broken arm64 PE). Both only
        # produce the native classifier JAR; the platform-independent wrapper JAR
        # comes from the dedicated build-java-wrapper job. msvc_arch selects the
        # MSVC toolset.
        include:
          - platform: linux_x86_64
            builder: ubuntu-24.04
            method: bazel
          - platform: linux_arm64
            builder: ubuntu-24.04-arm
            method: bazel
          # Cross-compiled on the arm64 Mac (Apple toolchain targets x86_64):
          # the Intel runner is far slower, and the artifact is still validated
          # on a real Intel host in the smoke phase below.
          - platform: darwin_x86_64
            builder: macos-14
            method: bazel
          - platform: darwin_aarch64
            builder: macos-14
            method: bazel
          - platform: windows_x86_64
            builder: windows-2022
            method: meson
            msvc_arch: amd64
          - platform: windows_arm64
            builder: windows-11-arm
            method: meson
            msvc_arch: amd64_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Decide whether to build this platform
        id: gate
        shell: bash
        run: |
          selected=",${{ inputs.platforms }},"
          selected="${selected// /}"
          if [[ "${selected}" == *",${{ matrix.platform }},"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false (not in inputs.platforms)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk space (Linux)
        if: steps.gate.outputs.run == 'true' && runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
      # --- Bazel path (linux/macOS): native lib + wrapper/tool JARs ---
      - name: Pin Bazel version
        if: steps.gate.outputs.run == 'true' && matrix.method == 'bazel'
        shell: bash
        run: echo "USE_BAZEL_VERSION=$(tr -d '[:space:]' < .bazelversion)" >> "$GITHUB_ENV"
      - name: Set up Bazel
        if: steps.gate.outputs.run == 'true' && matrix.method == 'bazel'
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: java-${{ matrix.platform }}
      - name: Build native + JARs (${{ matrix.platform }})
        if: steps.gate.outputs.run == 'true' && matrix.method == 'bazel'
        shell: bash
        run: python3 tools/build_java_artifacts.py --platform ${{ matrix.platform }} --bazel bazel
      # NOTE: the platform-independent wrapper JAR is NOT uploaded here. It is
      # produced once by the dedicated, always-run `build-java-wrapper` job so
      # that every platform selection -- including a Windows-only run whose Meson
      # legs build the native lib only -- still ships the wrapper.
      # --- Native Meson path (Windows): native classifier JAR only ---
      # Meson compiles the C API as a self-contained shared DLL with MSVC (all
      # deps static via subprojects/*.wrap, static CRT), then packages it into
      # the classifier JAR the Java FFM loader expects.
      - name: Set up MSVC
        if: steps.gate.outputs.run == 'true' && matrix.method == 'meson'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Set up Python
        if: steps.gate.outputs.run == 'true' && matrix.method == 'meson'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Use pwsh, NOT bash, for the Meson steps. The bash on the Windows runners
      # is Git Bash, which prepends C:\Program Files\Git\usr\bin to PATH on
      # startup. That dir ships a GNU link.exe that shadows the MSVC link.exe
      # msvc-dev-cmd put on PATH, so Meson's linker probe errors out with
      # "Found GNU link.exe instead of MSVC link.exe". pwsh leaves the
      # MSVC-first PATH from msvc-dev-cmd intact.
      - name: Install Meson + Ninja
        if: steps.gate.outputs.run == 'true' && matrix.method == 'meson'
        shell: pwsh
        run: python -m pip install --upgrade meson ninja
      - name: Build native lib (${{ matrix.platform }})
        if: steps.gate.outputs.run == 'true' && matrix.method == 'meson'
        shell: pwsh
        run: python tools/build_java_native_meson.py --platform ${{ matrix.platform }}
      - name: Upload native classifier JAR
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}
          path: artifacts/jars/fastslide-native-*-*.jar
          if-no-files-found: error
          retention-days: 7
  build-java-wrapper:
    # The wrapper + tool JARs are platform-independent pure Java
    # (//java:fastslide_java is a plain java_library with no third-party deps).
    # Build them ONCE on Linux with Bazel, UNCONDITIONALLY (not gated on
    # inputs.platforms), so every selection -- including a Windows-only run whose
    # Meson legs build native libs only -- still ships the wrapper that the smoke
    # test and downstream consumers need. Using Bazel (not javac) keeps the
    # bytecode identical to what the bazel legs produce (java_language_version 21,
    # FFM), avoiding any toolchain/target-version divergence.
    name: Build Java wrapper JAR
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Pin Bazel version
        shell: bash
        run: echo "USE_BAZEL_VERSION=$(tr -d '[:space:]' < .bazelversion)" >> "$GITHUB_ENV"
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: java-wrapper
      - name: Build wrapper + tool JARs
        shell: bash
        run: python3 tools/build_java_artifacts.py --wrapper-only --bazel bazel
      - name: Upload wrapper JAR
        uses: actions/upload-artifact@v6
        with:
          name: wrapper-all
          path: artifacts/jars/fastslide-java-*.jar
          if-no-files-found: error
          retention-days: 7
  smoke-java:
    name: Smoke Java ${{ matrix.platform }}
    needs: [build-java, build-java-wrapper]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            runner: ubuntu-24.04
            java_arch: x64
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
            java_arch: aarch64
          # No bootable Intel macOS runner; validate the x86_64 dylib under
          # Rosetta on the arm64 runner with an x86_64 JDK.
          - platform: darwin_x86_64
            runner: macos-14
            java_arch: x64
            rosetta: true
          - platform: darwin_aarch64
            runner: macos-14
            java_arch: aarch64
          - platform: windows_x86_64
            runner: windows-2022
            java_arch: x64
          - platform: windows_arm64
            runner: windows-11-arm
            java_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Decide whether to smoke this platform
        id: gate
        shell: bash
        run: |
          selected=",${{ inputs.platforms }},"
          selected="${selected// /}"
          if [[ "${selected}" == *",${{ matrix.platform }},"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rosetta
        if: steps.gate.outputs.run == 'true' && matrix.rosetta
        run: softwareupdate --install-rosetta --agree-to-license
      # FastSlide's FFM code needs a JDK >= 22; 23 is the highest Temurin ships
      # across every runner arch. Pin the architecture so the JVM matches the
      # artifact under test (x64 runs via Rosetta on the arm runner).
      - name: Set up JDK
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "23"
          architecture: ${{ matrix.java_arch }}
      - name: Download built JARs
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@v6
        with:
          path: artifacts/jars
          pattern: "{native,wrapper}-*"
          merge-multiple: true
      - name: On-target smoke test (${{ matrix.platform }})
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: python3 tools/smoke_test_java.py --platform ${{ matrix.platform }}
  build-wheels:
    name: Build wheels ${{ matrix.platform }}
    runs-on: ${{ matrix.builder }}
    strategy:
      fail-fast: false
      matrix:
        # Linux/macOS wheels are built with Bazel (method: bazel). Windows wheels
        # (both amd64 and arm64) are built NATIVELY on a matching Windows runner
        # via Meson + nanobind + cibuildwheel (method: meson): many Bazel rules
        # lack Windows host support, so the meson-python path (all deps static via
        # wraps) is used instead. cibw_arch selects the cibuildwheel target arch.
        include:
          - platform: linux_x86_64
            builder: ubuntu-24.04
            method: bazel
          - platform: linux_arm64
            builder: ubuntu-24.04-arm
            method: bazel
          - platform: darwin_x86_64
            builder: macos-14
            method: bazel
          - platform: darwin_aarch64
            builder: macos-14
            method: bazel
          - platform: windows_x86_64
            builder: windows-2022
            method: meson
            cibw_arch: AMD64
          - platform: windows_arm64
            builder: windows-11-arm
            method: meson
            cibw_arch: ARM64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Decide whether to build this platform
        id: gate
        shell: bash
        run: |
          selected=",${{ inputs.platforms }},"
          selected="${selected// /}"
          if [[ "${selected}" == *",${{ matrix.platform }},"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false (not in inputs.platforms)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk space (Linux)
        if: steps.gate.outputs.run == 'true' && runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
      # --- Bazel path (linux/darwin) ---
      - name: Pin Bazel version
        if: steps.gate.outputs.run == 'true' && matrix.method == 'bazel'
        shell: bash
        run: echo "USE_BAZEL_VERSION=$(tr -d '[:space:]' < .bazelversion)" >> "$GITHUB_ENV"
      - name: Set up Bazel
        if: steps.gate.outputs.run == 'true' && matrix.method == 'bazel'
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: wheels-${{ matrix.platform }}
      - name: Build wheels (${{ matrix.platform }})
        if: steps.gate.outputs.run == 'true' && matrix.method == 'bazel'
        shell: bash
        run: python3 tools/build_wheels.py --platform ${{ matrix.platform }} --bazel bazel
      # --- Native Meson path (windows) ---
      # Windows wheels are compiled on a real Windows host with MSVC. cibuildwheel
      # drives meson-python once per CPython; meson-python reads the forcefallback
      # setup args from pyproject.toml, so every dependency (aifocore/simpletiff
      # via git wraps, codecs via WrapDB) is built from source and linked
      # statically into the self-contained _fastslide.pyd. No DLLs to bundle.
      # Two cibuildwheel invocations, because the stable-ABI and version-specific
      # wheels need different Meson setup args and cibuildwheel applies
      # config-settings uniformly across one run. Both write to the same
      # output-dir. `--vsenv` forces MSVC: the windows-2022/windows-11-arm images
      # ship MinGW GCC (C:\mingw64\bin) on PATH and Meson's auto-detection picks
      # that `cc` over MSVC, producing a GCC build (which also hits the
      # MinGW-only jpeglib.h/<cstdio> FILE error). It makes Meson activate the
      # Visual Studio environment even when another compiler is already on PATH,
      # matching the MSVC toolchain used by the Java native build.
      - name: Build cp311 wheel (${{ matrix.platform }})
        if: steps.gate.outputs.run == 'true' && matrix.method == 'meson'
        uses: pypa/cibuildwheel@v3.2.0
        with:
          package-dir: .
          output-dir: artifacts/wheels
        env:
          # 3.11 predates nanobind's stable-ABI floor, so this is a conventional
          # version-specific build. `python.allow_limited_api` defaults to false
          # in meson.build, which is what keeps meson-python from trying to tag
          # the result abi3 (it errors out rather than mislabel the wheel).
          CIBW_BUILD: "cp311-*"
          CIBW_ARCHS_WINDOWS: ${{ matrix.cibw_arch }}
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_CONFIG_SETTINGS_WINDOWS: "setup-args=--vsenv"
      - name: Build cp312-abi3 wheel (${{ matrix.platform }})
        if: steps.gate.outputs.run == 'true' && matrix.method == 'meson'
        uses: pypa/cibuildwheel@v3.2.0
        with:
          package-dir: .
          output-dir: artifacts/wheels
        env:
          # Opting in to the limited API here is what makes meson-python stamp
          # the wheel `cp312-abi3` instead of `cp312-cp312`; the pyproject.toml
          # `limited-api = true` key alone is inert while the Meson option is
          # off. The result installs on every CPython >= 3.12.
          CIBW_BUILD: "cp312-*"
          CIBW_ARCHS_WINDOWS: ${{ matrix.cibw_arch }}
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_CONFIG_SETTINGS_WINDOWS: "setup-args=--vsenv setup-args=-Dpython.allow_limited_api=true"
      - name: Upload wheels
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.platform }}
          path: artifacts/wheels/*.whl
          if-no-files-found: error
          retention-days: 7
  build-sdist:
    # The source distribution is platform-independent and is what
    # `pip install fastslide` falls back to on ANY platform/Python without a
    # prebuilt wheel: pip builds it from source via meson-python, where
    # --wrap-mode=forcefallback (from pyproject.toml) fetches every dependency
    # through subprojects/*.wrap and links it statically. meson-python assembles
    # the tarball from git-tracked files, so the wraps + packagefiles overlays
    # are included (the re-downloaded dependency sources are not). NOT gated on
    # inputs.platforms: the sdist is wanted for every release regardless of which
    # binary platforms were selected.
    name: Build sdist
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Build sdist
        shell: bash
        run: uv build --sdist --out-dir artifacts/sdist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: artifacts/sdist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  build-deb:
    # Debian packages are Linux-only and built with the NATIVE host toolchain
    # (system gcc/libstdc++) so the shipped .so matches the distribution it is
    # installed on. Each leg builds its own arch runtime deb plus the
    # arch-independent -dev deb (headers), so the per-platform smoke can install
    # both without pulling a cross-arch runtime.
    name: Build deb ${{ matrix.platform }}
    runs-on: ${{ matrix.builder }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            builder: ubuntu-24.04
            deb_arch: amd64
          - platform: linux_arm64
            builder: ubuntu-24.04-arm
            deb_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Decide whether to build this platform
        id: gate
        shell: bash
        run: |
          selected=",${{ inputs.platforms }},"
          selected="${selected// /}"
          if [[ "${selected}" == *",${{ matrix.platform }},"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false (not in inputs.platforms)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk space (Linux)
        if: steps.gate.outputs.run == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
      - name: Pin Bazel version
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: echo "USE_BAZEL_VERSION=$(tr -d '[:space:]' < .bazelversion)" >> "$GITHUB_ENV"
      - name: Set up Bazel
        if: steps.gate.outputs.run == 'true'
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: deb-${{ matrix.platform }}
      - name: Build Debian packages (${{ matrix.platform }})
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bazel build \
            //package:libfastslide_${{ matrix.deb_arch }} \
            //package:libfastslide_dev
          mkdir -p artifacts/debs
          # pkg_deb emits the canonical, versioned filename (via
          # package_file_name) AND a symlink named after the Bazel target
          # (e.g. libfastslide_amd64.deb -> libfastslide_0.8.0_amd64.deb).
          # Copy only the canonical files so releases don't carry byte-identical
          # duplicates. -L dereferences in case the canonical file itself is a
          # bazel-out symlink.
          bin="$(bazel info bazel-bin)/package"
          cp -L "${bin}"/libfastslide_*_*.deb artifacts/debs/
          cp -L "${bin}"/libfastslide-dev_*_all.deb artifacts/debs/
          ls -l artifacts/debs
      - name: Upload debs
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: debs-${{ matrix.platform }}
          path: artifacts/debs/*.deb
          if-no-files-found: error
          retention-days: 7
  smoke-deb:
    # Prove the built packages install and are usable on a clean system:
    # install the runtime + dev debs with apt, then compile a standalone C++
    # program (package/deb_smoke.cpp) with the SYSTEM compiler against ONLY the
    # installed SDK and run it, plus exercise the shipped fastslidetool CLI. The
    # container base (ubuntu:24.04) matches the build-deb runner so the .so ABI
    # lines up. Runs natively per arch (no emulation).
    name: Smoke deb ${{ matrix.platform }}
    needs: build-deb
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            runner: ubuntu-24.04
            docker_platform: linux/amd64
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
            docker_platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Decide whether to smoke this platform
        id: gate
        shell: bash
        run: |
          selected=",${{ inputs.platforms }},"
          selected="${selected// /}"
          if [[ "${selected}" == *",${{ matrix.platform }},"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download debs (${{ matrix.platform }})
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@v6
        with:
          name: debs-${{ matrix.platform }}
          path: debs
      - name: Docker smoke (${{ matrix.platform }})
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke_ctx
          cp package/Dockerfile package/deb_smoke.cpp package/deb_smoke_c.c smoke_ctx/
          cp debs/*.deb smoke_ctx/
          ls -l smoke_ctx
          # Retry the build: the arm64 image installs deps from ports.ubuntu.com,
          # which intermittently times out from the CI network. --no-cache on
          # retries forces a fresh apt-get update instead of reusing a failed
          # layer.
          attempts=3
          for attempt in $(seq 1 "${attempts}"); do
            echo "::group::docker build (attempt ${attempt}/${attempts})"
            cache_flag=""
            if [[ "${attempt}" -gt 1 ]]; then
              cache_flag="--no-cache"
            fi
            if docker build ${cache_flag} --platform ${{ matrix.docker_platform }} \
                -t fastslide-deb-smoke smoke_ctx; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "docker build failed on attempt ${attempt}/${attempts}"
            if [[ "${attempt}" -lt "${attempts}" ]]; then
              sleep $((attempt * 15))
            fi
          done
          echo "docker build failed after ${attempts} attempts" >&2
          exit 1
  # TEMPORARILY DISABLED: the source build pulls simpletiff from its pinned git
  # wrap (subprojects/simpletiff.wrap @ 3886522), which predates the
  # <cstdio>-before-<jpeglib.h> fix and so fails to compile under GCC. Re-enable
  # once the simpletiff repo carries the fix and the wrap revision is bumped.
  # Restore: uncomment this job and re-add `smoke-sdist` to the `needs` lists of
  # publish-pypi, publish-testpypi, and github-release below.
  # smoke-sdist:
  #   # Prove the source-build path actually works (the whole point of shipping an
  #   # sdist): install the tarball with --no-binary so pip MUST compile fastslide
  #   # from source on a clean runner -- exactly what an unsupported platform does
  #   # -- then run the import + open-sample smoke. numpy is allowed as a wheel
  #   # (only fastslide itself is forced to build from source).
  #   name: Smoke sdist (source build)
  #   needs: build-sdist
  #   runs-on: ubuntu-24.04
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v5
  #     - name: Set up uv
  #       uses: astral-sh/setup-uv@v6
  #     - name: Download sdist
  #       uses: actions/download-artifact@v6
  #       with:
  #         name: sdist
  #         path: dist
  #     - name: Source-build install + smoke
  #       shell: bash
  #       run: |
  #         set -euo pipefail
  #         uv python install 3.12
  #         uv venv --python 3.12 .venv
  #         uv pip install --python .venv/bin/python --no-binary fastslide dist/*.tar.gz
  #         .venv/bin/python tools/smoke_test_python.py
  smoke-wheels:
    name: Smoke wheel ${{ matrix.target.platform }} py${{ matrix.python }}
    needs: build-wheels
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Two wheels per platform: a cp311 one, and a cp312-abi3 one imported on
        # every CPython >= 3.12 to prove the stable-ABI tag really does load
        # across versions. uv resolves each interpreter to its matching wheel.
        python: ["3.11", "3.12", "3.13", "3.14"]
        target:
          - platform: linux_x86_64
            runner: ubuntu-24.04
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
          # x86_64 wheel runs under Rosetta on the arm64 mac with an x86_64
          # CPython (uv downloads the matching build).
          - platform: darwin_x86_64
            runner: macos-14
            rosetta: true
          - platform: darwin_aarch64
            runner: macos-14
          - platform: windows_x86_64
            runner: windows-2022
          - platform: windows_arm64
            runner: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Decide whether to smoke this platform
        id: gate
        shell: bash
        run: |
          selected=",${{ inputs.platforms }},"
          selected="${selected// /}"
          if [[ "${selected}" == *",${{ matrix.target.platform }},"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rosetta
        if: steps.gate.outputs.run == 'true' && matrix.target.rosetta
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Set up uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6
      - name: Download wheels
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: "wheels-*"
          merge-multiple: true
      # Build a venv on the right interpreter (x86_64 CPython for the Rosetta
      # leg), install the local wheel under test (uv picks the dist wheel whose
      # tags match the venv's Python/arch), and run the import + open-sample
      # smoke.
      #
      # numpy (the only runtime dep, and NOT vendored in dist) is installed from
      # the index in a separate step so that fastslide itself can be installed
      # with --no-index. That pin matters: pip/uv prefer an exact cpXY tag over
      # an abi3 one, so with the index enabled a same-version wheel already on
      # PyPI would outrank the local cp312-abi3 wheel on 3.13/3.14 and the job
      # would silently smoke-test the published artifact instead of this build.
      - name: Import + open-sample smoke (${{ matrix.target.platform }} py${{ matrix.python }})
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pyreq="${{ matrix.python }}"
          if [ "${{ matrix.target.rosetta }}" = "true" ]; then
            pyreq="cpython-${{ matrix.python }}-macos-x86_64"
          fi
          uv python install "$pyreq"
          uv venv --python "$pyreq" .venv
          if [ "${{ runner.os }}" = "Windows" ]; then
            py=".venv/Scripts/python.exe"
          else
            py=".venv/bin/python"
          fi
          uv pip install --python "$py" numpy
          uv pip install --python "$py" --no-index --find-links dist fastslide
          "$py" tools/smoke_test_python.py
  publish-pypi:
    name: Publish wheels + sdist to PyPI
    # Full release -> real PyPI. Only after the wheels AND the source build pass
    # their smoke tests. The sdist is uploaded alongside the wheels so pip can
    # fall back to a source build on any platform without a prebuilt wheel.
    if: inputs.release == true
    needs: [smoke-wheels]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing (no API token)
    steps:
      - name: Download wheels + sdist
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
      - name: List distributions
        shell: bash
        run: ls -l dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
  publish-testpypi:
    name: Publish wheels + sdist to TestPyPI
    # Snapshot -> TestPyPI, so the publish path is exercised without touching
    # the real index. (Version comes from versions.json, so re-runs of the same
    # version are no-ops thanks to skip-existing.)
    if: inputs.release == false
    needs: [smoke-wheels]
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download wheels + sdist
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
      - name: List distributions
        shell: bash
        run: ls -l dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
  github-release:
    name: Publish GitHub Release
    needs: [smoke-java, smoke-wheels, build-wheels, build-sdist, build-deb, smoke-deb, publish-pypi, publish-testpypi]
    # publish-pypi / publish-testpypi are mutually exclusive, so one is always
    # skipped. A skipped need is not success(), which would skip this job too;
    # gate on "nothing failed/cancelled" instead so the skipped sibling is OK.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
      id-token: write # SLSA provenance signing
      attestations: write # record the attestation
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download JARs
        uses: actions/download-artifact@v6
        with:
          path: artifacts/jars
          pattern: "{native,wrapper}-*"
          merge-multiple: true
      - name: Download wheels
        uses: actions/download-artifact@v6
        with:
          path: artifacts/wheels
          pattern: "wheels-*"
          merge-multiple: true
      - name: Download sdist
        uses: actions/download-artifact@v6
        with:
          name: sdist
          path: artifacts/sdist
      - name: Download debs
        uses: actions/download-artifact@v6
        with:
          path: artifacts/debs
          pattern: "debs-*"
          merge-multiple: true
      - name: List collected artifacts
        shell: bash
        run: |
          echo "JARs:"; ls -l artifacts/jars
          echo "Wheels:"; ls -l artifacts/wheels
          echo "Sdist:"; ls -l artifacts/sdist
          echo "Debs:"; ls -l artifacts/debs || echo "(no debs)"
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            artifacts/jars/*.jar
            artifacts/wheels/*.whl
            artifacts/sdist/*.tar.gz
            artifacts/debs/*.deb
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          channel="--snapshot"
          require=""
          if [[ "${{ inputs.release }}" == "true" ]]; then
            channel="--release"
            require="--require-all"
          fi
          python3 tools/publish_artifacts.py \
            --dest github ${channel} ${require} \
            --wheels-dir artifacts/wheels \
            --sdist-dir artifacts/sdist \
            --debs-dir artifacts/debs \
            --generate-notes
