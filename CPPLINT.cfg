filter=-build/c++11  # Reports e.g. chrono and thread, which overlap with Chromium's API. Not applicable to general C++ projects.
filter=-build/c++17  # google only restrictions not relevant

filter=-whitespace/parens,-whitespace/braces  # Conflict with clang-format
filter=-whitespace/newline # handled by clang-format
filter=-whitespace/blank_line # conflicts with clang-format
filter=-whitespace/indent_namespace # handled by clang-format and has disagreements with cpplint
filter=-whitespace/line_length # handled by clang-format
filter=-readability/braces # conflicts with clang-format

exclude_files=third_party/.*
exclude_files=subprojects/*
exclude_files=aifo/fastslide/build_wasm/.*
