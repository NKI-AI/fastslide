<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastSlide WASM Viewer</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ol@v10.3.1/ol.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.3.1/dist/ol.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: "#f0f9ff",
                100: "#e0f2fe",
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
              },
            },
          },
        },
      };
    </script>
    <style>
      /* Custom overrides for OpenLayers in Tailwind */
      .ol-control button {
        background-color: white !important;
        color: #374151 !important;
        /* gray-700 */
        border: 1px solid #d1d5db !important;
        /* gray-300 */
      }

      .ol-control button:hover {
        background-color: #f3f4f6 !important;
        /* gray-100 */
      }

      .ol-control button:focus {
        outline: 2px solid #0ea5e9 !important;
        /* primary-500 */
      }

      /* Full height layout */
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      #map {
        flex: 1;
        width: 100%;
        background: #111827;
        /* gray-900 */
      }

      /* Sidebar scroll */
      #sidebar {
        scrollbar-width: thin;
        scrollbar-color: #4b5563 transparent;
      }

      #sidebar::-webkit-scrollbar {
        width: 6px;
      }

      #sidebar::-webkit-scrollbar-track {
        background: transparent;
      }

      #sidebar::-webkit-scrollbar-thumb {
        background-color: #4b5563;
        border-radius: 3px;
      }
    </style>
  </head>

  <body class="bg-gray-900 text-gray-100 font-sans antialiased">
    <!-- Header -->
    <header
      class="bg-gray-800 border-b border-gray-700 shadow-sm z-10 shrink-0"
    >
      <div
        class="max-w-full mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <div class="bg-primary-600 text-white p-1.5 rounded-lg">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"
              />
            </svg>
          </div>
          <h1 class="text-xl font-bold tracking-tight text-white">
            FastSlide <span class="text-primary-500">WASM</span>
          </h1>
        </div>

        <div
          id="header-info"
          class="hidden md:flex gap-6 text-sm text-gray-400"
        >
          <span id="format-info" class="font-medium text-gray-300"></span>
          <span id="dimensions-info"></span>
        </div>

        <div class="flex items-center gap-4">
          <div
            id="status"
            class="hidden text-sm font-medium px-3 py-1 rounded-full transition-all duration-300"
          ></div>
          <button
            id="open-file"
            class="inline-flex items-center justify-center rounded-lg bg-primary-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primary-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Open Slide
          </button>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex overflow-hidden">
      <!-- Sidebar (Collapsible?) -->
      <aside
        id="sidebar"
        class="w-80 bg-gray-800 border-r border-gray-700 flex-shrink-0 overflow-y-auto hidden"
      >
        <div class="p-6 space-y-6">
          <!-- Slide Info -->
          <div id="slide-info">
            <h2
              class="text-lg font-semibold text-primary-400 mb-4 flex items-center gap-2"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="w-5 h-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"
                />
              </svg>
              Slide Details
            </h2>

            <div
              class="space-y-3 bg-gray-900/50 p-4 rounded-xl border border-gray-700/50"
            >
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">Format</span>
                <span class="font-medium text-gray-200" id="info-format"
                  >-</span
                >
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">Dimensions</span>
                <span class="font-medium text-gray-200" id="info-dimensions"
                  >-</span
                >
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">MPP (µm/px)</span>
                <span class="font-medium text-gray-200" id="info-mpp">-</span>
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">Levels</span>
                <span class="font-medium text-gray-200" id="info-levels"
                  >-</span
                >
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">File Size</span>
                <span class="font-medium text-gray-200" id="info-filesize"
                  >-</span
                >
              </div>
            </div>
          </div>

          <!-- Pyramid Levels -->
          <div>
            <h2
              class="text-lg font-semibold text-primary-400 mb-4 flex items-center gap-2"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="w-5 h-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
                />
              </svg>
              Pyramid Levels
            </h2>
            <div id="level-list" class="space-y-2">
              <!-- Levels populated via JS -->
            </div>
          </div>
        </div>

        <!-- Read Region Control (Dynamically loaded) -->
        <div id="read-region-container"></div>
      </aside>

      <!-- Viewer Area -->
      <div id="viewer-container" class="flex-1 relative bg-gray-900">
        <div id="map" class="absolute inset-0"></div>

        <!-- Initial Welcome State -->
        <div
          id="welcome-msg"
          class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 pointer-events-none z-0"
        >
          <div
            class="w-20 h-20 bg-gray-800 rounded-full flex items-center justify-center mb-6 ring-1 ring-gray-700"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-10 h-10 text-gray-400"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"
              />
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-gray-300 mb-2">
            Welcome to FastSlide
          </h2>
          <p class="text-gray-500">Open a slide image to begin viewing</p>
        </div>

        <!-- Loading Overlay -->
        <div
          id="loading-overlay"
          class="absolute inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50"
        >
          <div class="flex flex-col items-center gap-4">
            <svg
              class="animate-spin h-10 w-10 text-primary-500"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            <span class="text-primary-100 font-medium">Processing...</span>
          </div>
        </div>
      </div>
    </main>

    <script type="module">
      import { FastSlideSource } from "./fastslide-tilesource.js";

      let worker = null;
      let map = null;
      let currentLayer = null;

      // Initialize worker
      function initWorker() {
        worker = new Worker("./fastslide-worker.js", { type: "module" });

        worker.addEventListener("message", (e) => {
          const { type, data, message } = e.data;

          switch (type) {
            case "ready":
              showStatus("Ready", "success");
              document.getElementById("open-file").disabled = false;
              break;

            case "slideLoaded":
              handleSlideLoaded(data);
              break;

            case "tileData":
              // Handled by TileSource
              break;

            case "error":
              showStatus("Error: " + message, "error");
              hideLoading();
              break;

            default:
              console.log("Unknown message type:", type);
          }
        });

        worker.addEventListener("error", (err) => {
          showStatus("Worker error: " + err.message, "error");
          hideLoading();
        });
      }

      // Open file dialog
      document
        .getElementById("open-file")
        .addEventListener("click", async () => {
          try {
            const [fileHandle] = await window.showOpenFilePicker({
              types: [
                {
                  description: "Whole Slide Images",
                  accept: {
                    "image/*": [".svs", ".mrxs", ".tiff", ".tif", ".qptiff"],
                  },
                },
              ],
              multiple: false,
            });

            const file = await fileHandle.getFile();
            showLoading();
            showStatus("Loading...", "loading");

            worker.postMessage({ type: "loadFile", data: { file } });
          } catch (err) {
            if (err.name !== "AbortError") {
              showStatus("Error opening file", "error");
              console.error(err);
            }
          }
        });

      // Handle slide loaded
      function handleSlideLoaded(data) {
        // Fix: check if data is valid before destructuring
        if (!data) return;
        const {
          numLevels,
          dimensions,
          format,
          mpp,
          levelInfo,
          fileName,
          fileSize,
          parseTime,
        } = data;

        hideLoading();
        showStatus(`Loaded in ${parseTime.toFixed(0)}ms`, "success");

        // Update header info
        document.getElementById("format-info").textContent = format;
        document.getElementById(
          "dimensions-info"
        ).textContent = `${dimensions[0]} × ${dimensions[1]}`;

        // Update sidebar info
        document.getElementById("sidebar").classList.remove("hidden");
        document.getElementById("info-format").textContent = format;
        document.getElementById(
          "info-dimensions"
        ).textContent = `${dimensions[0]} × ${dimensions[1]}`;

        const mppStr =
          mpp && mpp[0] > 0 ? `${((mpp[0] + mpp[1]) / 2).toFixed(4)}` : "N/A";
        document.getElementById("info-mpp").textContent = mppStr;
        document.getElementById("info-levels").textContent = numLevels;
        document.getElementById("info-filesize").textContent =
          formatFileSize(fileSize);

        // Add Read Region UI
        const readRegionContainer = document.getElementById(
          "read-region-container"
        );
        readRegionContainer.innerHTML = `
                <div class="space-y-4 mt-8 border-t border-gray-700 pt-6 p-6">
                    <h2 class="text-lg font-semibold text-primary-400 mb-4 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
                        </svg>
                        Read Region
                    </h2>
                    
                    <div>
                        <label for="levelSelect" class="block text-sm font-medium text-gray-400 mb-1">Select Level</label>
                        <select id="levelSelect" class="w-full rounded-lg bg-gray-900 border-gray-700 text-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm py-2 px-3 border"></select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label for="regionX" class="block text-xs font-medium text-gray-500 mb-1">X Pos</label>
                            <input type="number" id="regionX" value="0" min="0" class="w-full rounded-lg bg-gray-900 border-gray-700 text-gray-300 border px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500" />
                        </div>
                        <div>
                            <label for="regionY" class="block text-xs font-medium text-gray-500 mb-1">Y Pos</label>
                            <input type="number" id="regionY" value="0" min="0" class="w-full rounded-lg bg-gray-900 border-gray-700 text-gray-300 border px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500" />
                        </div>
                        <div>
                            <label for="regionWidth" class="block text-xs font-medium text-gray-500 mb-1">Region W</label>
                            <input type="number" id="regionWidth" value="512" min="1" class="w-full rounded-lg bg-gray-900 border-gray-700 text-gray-300 border px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500" />
                        </div>
                        <div>
                            <label for="regionHeight" class="block text-xs font-medium text-gray-500 mb-1">Region H</label>
                            <input type="number" id="regionHeight" value="512" min="1" class="w-full rounded-lg bg-gray-900 border-gray-700 text-gray-300 border px-3 py-2 text-sm focus:border-primary-500 focus:ring-primary-500" />
                        </div>
                    </div>
                    
                    <button id="readRegionBtn" class="w-full justify-center rounded-lg bg-gray-700 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-gray-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600 transition-colors mt-2 border border-gray-600">
                        Read Region to Canvas
                    </button>
                </div>

                <!-- Preview Canvas Container (Hidden by default) -->
                <div id="previewContainer" class="mt-6 hidden border-t border-gray-700 pt-6 p-6">
                     <h3 class="text-sm font-medium text-gray-400 mb-2">Region Preview</h3>
                     <div class="bg-gray-900 border border-gray-700 rounded-lg p-2 overflow-auto max-h-64 flex justify-center">
                         <canvas id="previewCanvas" class="max-w-full"></canvas>
                     </div>
                     <div class="flex justify-end mt-2">
                        <button id="closePreviewBtn" class="text-xs text-red-400 hover:text-red-300">Close Preview</button>
                     </div>
                </div>
            `;

        // Populate level list
        const levelList = document.getElementById("level-list");
        const levelSelect = document.getElementById("levelSelect");

        levelList.innerHTML = "";
        if (levelSelect) levelSelect.innerHTML = "";

        levelInfo.forEach((level) => {
          const div = document.createElement("div");
          div.className =
            "flex justify-between items-center bg-gray-900/50 p-3 rounded-lg border border-gray-700/50 text-xs";
          div.innerHTML = `
                    <div class="font-medium text-primary-400">Level ${
                      level.level
                    }</div>
                    <div class="text-right">
                        <div class="text-gray-300">${level.width} × ${
            level.height
          }</div>
                        <div class="text-gray-500 mt-0.5">1/${level.downsampleFactor.toFixed(
                          0
                        )} scale</div>
                    </div>
          `;
          levelList.appendChild(div);

          if (levelSelect) {
            const option = document.createElement("option");
            option.value = level.level;
            option.textContent = `Level ${level.level} (${level.width}x${level.height})`;
            levelSelect.appendChild(option);
          }
        });

        // Attach event listeners for read region
        document
          .getElementById("readRegionBtn")
          .addEventListener("click", () => {
            const level = parseInt(
              document.getElementById("levelSelect").value,
              10
            );
            const x = parseInt(document.getElementById("regionX").value, 10);
            const y = parseInt(document.getElementById("regionY").value, 10);
            const width = parseInt(
              document.getElementById("regionWidth").value,
              10
            );
            const height = parseInt(
              document.getElementById("regionHeight").value,
              10
            );

            showStatus("Reading region...", "loading");

            worker.postMessage({
              type: "readRegion", // Assuming worker supports this message type as per `simpletiff`
              data: { level, x, y, width, height },
            });
          });

        document
          .getElementById("closePreviewBtn")
          .addEventListener("click", () => {
            document.getElementById("previewContainer").classList.add("hidden");
          });

        // Handle region data response
        if (!worker.regionHandlerAttached) {
          worker.addEventListener("message", (e) => {
            const { type, data } = e.data;
            if (type === "regionData") {
              // Assuming worker sends 'regionData' response
              handleRegionData(data);
            }
          });
          worker.regionHandlerAttached = true;
        }

        // Hide welcome message
        document.getElementById("welcome-msg").style.display = "none";

        // Create FastSlide Source
        const source = new FastSlideSource({
          worker,
          levelInfo,
          tileSize: 256,
        });

        const layer = new ol.layer.Tile({
          source: source,
        });

        // Calculate extent
        const width = dimensions[0];
        const height = dimensions[1];
        const extent = [0, 0, width, height];

        // Initialize Map
        if (map) {
          map.setTarget(null);
          map = null;
        }

        const projection = source.getProjection();
        // Clone resolutions from source
        let viewResolutions = [...source.getTileGrid().getResolutions()];

        // Add extra lower zoom levels (higher resolution values) to allow fitting the image
        // even if the pyramid doesn't go deep enough.
        // We want to be able to fit the whole image into a reasonably small area (e.g., min dimension of viewport).
        // Let's assume a safe minimum viewport dimension of roughly 200px.
        const maxRes = Math.max(width, height) / 200;

        // viewResolutions[0] is the current max resolution (most zoomed out)
        let currentMax = viewResolutions[0];

        while (currentMax < maxRes) {
          currentMax *= 2;
          viewResolutions.unshift(currentMax);
        }

        map = new ol.Map({
          target: "map",
          layers: [layer],
          view: new ol.View({
            projection: projection,
            resolutions: viewResolutions,
            extent: extent,
            showFullExtent: true,
            enableRotation: false, // Usually better for slides
          }),
          controls: ol.control.defaults.defaults().extend([
            new ol.control.FullScreen(),
            new ol.control.ZoomSlider(),
            new ol.control.MousePosition({
              coordinateFormat: ol.coordinate.createStringXY(0),
              className:
                "ol-mouse-position text-xs bg-gray-800/80 text-gray-300 p-1 rounded absolute top-2 right-12 font-mono",
            }),
          ]),
        });

        // Fit view to extent (scale to longest axis)
        map.getView().fit(extent, {
          padding: [20, 20, 20, 20], // Add some padding
          constrainResolution: false, // Allow zooming to exact fit even if not in resolutions array
        });
      }

      function handleRegionData(data) {
        const { width, height, channels, data: imageData } = data;
        showStatus(`Region read (${width}x${height})`, "success");

        const canvas = document.getElementById("previewCanvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        const imgData = ctx.createImageData(width, height);

        // Simple copy (assuming RGBA or RGB)
        if (channels === 3) {
          for (let i = 0; i < width * height; i++) {
            const srcIdx = i * 3;
            const dstIdx = i * 4;
            imgData.data[dstIdx] = imageData[srcIdx];
            imgData.data[dstIdx + 1] = imageData[srcIdx + 1];
            imgData.data[dstIdx + 2] = imageData[srcIdx + 2];
            imgData.data[dstIdx + 3] = 255;
          }
        } else if (channels === 4) {
          imgData.data.set(imageData);
        } else if (channels === 1) {
          for (let i = 0; i < width * height; i++) {
            const val = imageData[i];
            const dstIdx = i * 4;
            imgData.data[dstIdx] = val;
            imgData.data[dstIdx + 1] = val;
            imgData.data[dstIdx + 2] = val;
            imgData.data[dstIdx + 3] = 255;
          }
        }

        ctx.putImageData(imgData, 0, 0);
        document.getElementById("previewContainer").classList.remove("hidden");
      }

      // Hide welcome message
      // document.getElementById('welcome-msg').style.display = 'none';
      // ... (The following code was previously outside and causing ReferenceError, it is now moved inside handleSlideLoaded)

      // UI helpers
      function showLoading() {
        document.getElementById("loading-overlay").classList.remove("hidden");
        document.getElementById("loading-overlay").classList.add("flex");
      }

      function hideLoading() {
        document.getElementById("loading-overlay").classList.add("hidden");
        document.getElementById("loading-overlay").classList.remove("flex");
      }

      function showStatus(message, type) {
        const status = document.getElementById("status");
        status.textContent = message;
        status.classList.remove(
          "hidden",
          "text-blue-400",
          "bg-blue-400/10",
          "text-red-400",
          "bg-red-400/10",
          "text-green-400",
          "bg-green-400/10"
        );

        if (type === "loading") {
          status.classList.add("text-blue-400", "bg-blue-400/10");
        } else if (type === "error") {
          status.classList.add("text-red-400", "bg-red-400/10");
        } else if (type === "success") {
          status.classList.add("text-green-400", "bg-green-400/10");
        }

        status.classList.remove("hidden");

        if (type === "success" || type === "error") {
          setTimeout(() => {
            status.classList.add("hidden");
          }, 3000);
        }
      }

      function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        if (bytes < 1024 * 1024 * 1024)
          return (bytes / (1024 * 1024)).toFixed(1) + " MB";
        return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
      }

      // Initialize
      document.getElementById("open-file").disabled = true;
      showStatus("Initializing...", "loading");
      initWorker();
    </script>
